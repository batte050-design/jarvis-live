  // The notice locks the screen, so the page behind it must not scroll under his thumb either.
  try {
    if (on){
      if (prodNoticeScrollY === null) prodNoticeScrollY = window.scrollY || 0;
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = prodNoticeScrollRestore;
      prodNoticeScrollY = null;
    }
  } catch(e) {}
}
function voiceParkedDismiss(seq){
  if (seq !== undefined && seq !== prodNoticeSeq) return;    // a newer notice owns the card now
  clearTimeout(prodNoticeTimer);
  if (!prodNoticeEl) return;
  prodNoticeEl.classList.remove('on');
  prodLockScroll(false);
  const mine = prodNoticeSeq;
  setTimeout(function(){
    if (mine !== prodNoticeSeq) return;                      // it came back while this one was fading
    try { prodNoticeEl.hidden = true; } catch(e) {}
  }, 360);
}
// ---------------------------------------------------------------------------------------------
let nativeEar = null;            // set while a native capture is running
function closeWebMic(){
  // One capture at a time. Two microphones on one phone is how a turn ends up with its words from
  // one stream and its levels from the other.
  try { if (earMicStream) earMicStream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} }); } catch(e) {}
  earMicStream = null;
  try { if (micCtx && micCtx.state !== 'closed') micCtx.close(); } catch(e) {}
  micCtx = null; micAnalyser = null;
}
let nativeLevelHooked = false;   // the level listener is added once, not once per turn
let nativeFailures = 0;          // after one refusal, the webview path is used for the rest of the session
let earRing = [];                 // the rolling pre-roll while idle
let earCapture = [];              // everything from just before you spoke
// Words while he is still talking. The tick asks the local transcriber about the audio so far, every
// so often, so the box fills as he speaks rather than after. Local recognition, so repeats cost CPU
// and nothing else. Only one pass is ever in flight, and only the newest answer is shown.
let partialAt = 0, partialBusy = false, partialSeq = 0, typedBefore = "";
let earRecording = false;
let block = [], blockLen = 0, blockMs = 50;
let tickMs = 50;   // ms per level event. The worklet sends 50ms blocks; the native ear sends 20ms.
let quietSince = 0;   // silence is measured against the clock, not by counting blocks: the two
                      // capture paths publish levels at different rates, and counting one in units of
                      // the other is how a sentence got cut down to a fifth of a second.
let floor = 0.01, bleed = 0.02, tripCount = 0, quietBlocks = 0, loudBlocks = 0;
let EarAudioUntil = 0, EarQuietBlocks = 0;
let earTurnOpen = false;   // open from your message until the last of his audio finishes
let earQuietFrom = 0, recordStart = 0, barged = false, ignoreUntil = 0;
let earLastText = '', lastMeta = '';
// Item 5: the snapshot that is being recognised while he may still be talking.
let specAbort = null, specPromise = null, specSamples = 0;
const BUILD = 'v15-orbs';

function rmsOf(a){
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * a[i];
  return Math.sqrt(s / a.length);
}

async function openMic(){
  if (earMicStream) return true;
  try{
    earMicStream = await navigator.mediaDevices.getUserMedia({
      // All three off. Measured on his own recordings: with the echo canceller on, the same
      // speech came back as "Hello, Gary." instead of "Hello JARVIS.", and one clip was
      // captured at level 57 while the words were clearly spoken. The phone's audio
      // processing removes his voice along with the speaker's; the server normalises instead.
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  }catch(e){
    fail('Microphone refused. Allow it for this site, or type below.');
    showFallback();
    return false;
  }
  try{
    micCtx = new AudioContext({ sampleRate: 16000 });
    if (!micCtx.audioWorklet) throw new Error('no audio worklet');
    const earUrl = URL.createObjectURL(new Blob([earWORKLET], { type: 'application/javascript' }));
    await micCtx.audioWorklet.addModule(earUrl);
    const src = micCtx.createMediaStreamSource(earMicStream);
    micAnalyser = micCtx.createAnalyser();      // visual only, same stream: no second capture
    micAnalyser.fftSize = 512;
    micAnalyser.smoothingTimeConstant = 0.70;
    micFreq = new Uint8Array(micAnalyser.frequencyBinCount);
    src.connect(micAnalyser);
    const earNode = new AudioWorkletNode(micCtx, 'earCapture');
    earNode.port.onmessage = ev => pushSamples(ev.data);
    src.connect(earNode);
    rate = micCtx.sampleRate;
    return true;
  }catch(e){
    fail('This browser cannot record. Use the typing box below.');
    showFallback();
    return false;
  }
}

function pushSamples(chunk){
  if (chunk.length > 4){
    block.push(chunk); blockLen += chunk.length;
    if (blockLen >= rate * blockMs / 1000){
      const earFlat = new Float32Array(blockLen);
      let o = 0;
      for (const a of block){ earFlat.set(a, o); o += a.length; }
      block = []; blockLen = 0;
      onBlock(earFlat, rmsOf(earFlat));
    }
  }
  if (earRecording) earCapture.push(chunk);
  else {
    earRing.push(chunk);
    let n = 0;
    for (const a of earRing) n += a.length;
    while (n > rate * 1.0 && earRing.length > 1){ n -= earRing[0].length; earRing.shift(); }   // keep one second
  }
}

function onBlock(earFlat, lv){
  if (!earArmed) return;
  if (mode === 'text') return;      // text mode: the microphone is shut, whatever the flags say

  if (playing){
    EarAudioUntil = Date.now() + 500;   // that sound came from the speaker, not from you
    // A recording already under way when he starts speaking is capturing HIS voice off the
    // speaker. That produced a 7.8 second clip of his own answer, fed back as the question.
    if (earRecording && !barged){
      earRecording = false; earCapture = []; earRing = [];
      console.log('discarded a recording: he started speaking, so that was his voice');
      setState('speaking');
    }
    // Loudness cannot separate your voice from his coming back off the phone's own speaker
    // (measured: yours 743-2561, his 2336-5402), and automatic interruption broke the
    // conversation twice. It is off. Tapping the button stops him, and that always works.
    if (!barged) bleed = bleed * 0.9 + lv * 0.1;
    tripCount = 0;
    return;
  }

  if (turnActive && !earRecording){
    // he is thinking: stay quiet and wait
    return;
  }

  if (!earRecording){
    // Do not listen while he is producing: thinking, streaming, speaking, or in the short
    // gap between his sentences. That is what stops him recording his own voice. A
    // deliberate interruption is the one exception, and it arrives with barged set.
    // Requiring quiet here was wrong: it reset itself on the first loud block and made the
    // page deaf to continuous speech, so the speaker's tail got recorded instead.
    if ((earTurnOpen || turnActive || Date.now() < EarAudioUntil) && !barged){ loudBlocks = 0; return; }
    // the quiet level of this room: falls at once, rises very slowly, so a sudden loud
    // noise (the speaker, a door, a shout) cannot leave the page deaf for seconds after
    if (lv < floor) floor = floor * 0.5 + lv * 0.5;
    else floor = floor * 0.995 + lv * 0.005;
    const gate = Math.max(floor * 3.0, 0.024);
    if (lv > gate){
      if (++loudBlocks >= 3){ loudBlocks = 0; beginCapture(); }
    } else loudBlocks = Math.max(0, loudBlocks - 1);
    return;
  }

  // earRecording: stop once you have been quiet for a moment
  const quiet = lv < Math.max(floor * 2.0, 0.018);
  if (!quiet && specPromise){
    // Loud again before the endpoint: he was only pausing between words, so the snapshot holds
    // half a sentence. Drop it and let the real upload carry all of it.
    tl('speculation dropped');
    dropSpeculation();
  }
  quietBlocks = quiet ? quietBlocks + 1 : 0;
  if (quiet){ if (!quietSince) quietSince = Date.now(); } else quietSince = 0;
  const earQuietMs = quietSince ? (Date.now() - quietSince) : 0;
  const earSpokeMs = (Date.now() - recordStart);
  // Start recognising before he stops (item 5): at 600ms of quiet the audio so far goes up, so
  // the transcriber is already working when the endpoint fires at 1300ms. The endpoint itself is
  // untouched — shortening it still cuts him off mid-phrase.
  if (earQuietMs >= 600 && !specPromise && earCapture.length){
    const snap = flattenAudio(earCapture);
    if (snap.length / rate >= 0.4){
      const up = uploadAudio(snap, true);
      specAbort = up.ctl; specPromise = up.promise; specSamples = snap.length;
      tl('speculative upload');
    }
  }
  // a natural gap between words used to end the recording and cut him off mid-phrase,
  // which is why "hello JARVIS" arrived as "Hello."
  // Every 900ms of continuous speech, ask what he has said so far. Bounded window, one in flight.
  if (earSpokeMs > 900 && !partialBusy && earRecording && earCapture.length &&
      Date.now() - partialAt > 900){
    const win = lastSeconds(earCapture, 10);
    if (win.length / rate >= 0.8){
      partialAt = Date.now(); partialBusy = true;
      const mySeq = ++partialSeq;
      const up = uploadAudio(win, true);
      up.promise.then(({ d }) => {
        if (mySeq !== partialSeq || !earRecording) return;      // a newer pass owns the box now
        const t = ((d && d.text) || '').trim();
        if (t.length > 1) showPartial(t);
      }).catch(() => {}).then(() => { if (mySeq === partialSeq) partialBusy = false; });
    }
  }
  if (earQuietMs >= 1300 && earSpokeMs > 400){ tl('endpoint decided'); tlEndpoint = Math.round(performance.now() - TL0); endCapture(); }
  else if (earSpokeMs > 20000) endCapture();
}

function beginCapture(){
  if (VOICE_PARKED) return;                            // parked: the microphone stays shut, and
                                                       // nothing is said unless he asked for it
  if (earRecording) return;
  earRecording = true; recordStart = Date.now(); quietBlocks = 0; quietSince = 0;
  tl('recording started');
  earCapture = earRing.slice();                 // the second before you spoke: nothing gets cut off
  partialAt = 0; partialBusy = false; partialSeq++;
  try { typedBefore = (document.getElementById('q') || {}).value || ''; } catch(e) { typedBefore = ""; }
  earRing = [];
  setState('capturing');
  if (NATIVE_EAR && nativeFailures === 0 && mode !== 'text'){
    nativeEar = NATIVE_EAR;
    tickMs = 20;                     // reported cadence of the native ear, for the watchdog line
    closeWebMic();
    tl('native capture started');
    if (!nativeLevelHooked){
      nativeLevelHooked = true;
      try {
        nativeEar.addListener('level', function(ev){
          if (!nativeEar) return;      // nothing of this runs outside a native capture
          const r = (ev && ev.rms) || 0;
          try { reactor.tEnergy = Math.min(1, r * 3); } catch(e) {}
          onBlock([], r);              // the same level path the worklet feeds, so endpointing is unchanged
        });
      } catch(e) { console.log('native level listener failed', e); }
    }
    nativeEar.start().catch(function(e){
      console.log('native microphone refused, using the webview', e);
      // A permission answer is not a broken shell: the next tap may well be granted, so the native ear
      // stays available. Anything else is a genuine fault and the webview path takes over for good.
      const msg = String((e && (e.message || e.errorMessage)) || e || '').toLowerCase();
      const permissionish = msg.indexOf('grant') >= 0 || msg.indexOf('permission') >= 0 || msg.indexOf('denied') >= 0;
      if (!permissionish) nativeFailures++;
      nativeEar = null;
      tickMs = 50;
      syncMic();
    });
    return;
  }
  syncMic();
}

function endCapture(){
  if (!earRecording) return;
  earRecording = false;
  if (nativeEar){ nativeEnd(); return; }      // the native window is the whole capture, pre-roll included
  syncMic();
  const earTotal = earCapture.reduce((n, a) => n + a.length, 0);
  const audio = earCapture;
  earCapture = [];
  if (earTotal < rate * 0.25 || Date.now() - recordStart < 300){
    dropSpeculation();
    setState(earArmed ? 'listening' : 'idle');
    return;
  }
  const earFlat = flattenAudio(audio);
  // If the snapshot is still alive, no new speech arrived after it, so its transcript is the whole
  // question: reuse it rather than uploading the same audio again.
  if (specPromise){
    const p = specPromise;
    specPromise = null; specAbort = null; specSamples = 0;
    tl('reusing the transcript already in flight');
    setState('transcribing');
    handleTranscription(p, earFlat.length / rate, true);
    return;
  }
  submit(earFlat);
}

// The tail of what he has said, at most, so a long monologue does not re-transcribe itself from the
// beginning on every pass.
function lastSeconds(list, sec){
  const need = Math.round(sec * rate);
  let total = 0;
  for (let i = list.length - 1; i >= 0; i--){ total += list[i].length; if (total >= need) return flattenAudio(list.slice(i)); }
  return flattenAudio(list);
}

// What he is being heard as, in the box he types in. His own words, so nothing is implied that he did
// not say, and an empty answer never wipes what he had already typed.
function showPartial(text){
  // Never the composer: #q is the page module's, and it decides what to send from that value, so an
  // engine writing there is how a typed turn loses its text. The "what I heard" line is the page's own
  // display surface and nothing reads it back, so partials go there and touch nothing.
  if (!text) return;
  try { say(text); } catch(e) {}
  window.__jarvisPartialPasses = (window.__jarvisPartialPasses || 0) + 1;
}

function flattenAudio(list){
  const total = list.reduce((n, a) => n + a.length, 0);
  const out = new Float32Array(total);
  let o = 0;
  for (const a of list){ out.set(a, o); o += a.length; }
  return out;
}

function toWav(samples, hz){
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (off, t) => { for (let i = 0; i < t.length; i++) v.setUint8(off + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, hz, true); v.setUint32(28, hz * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    off += 2;
  }
  return buf;
}

// One upload, usable either as a speculative snapshot or as the real thing. The promise is
// returned rather than consumed, so a speculative upload can be kept and reused if he was only
// pausing.
function uploadAudio(earFlat, speculative){
  const ctl = new AbortController();
  const headers = { 'Content-Type': 'audio/wav', 'X-Jarvis-Page': BUILD + (speculative ? '+spec' : '') };
  const earT0 = performance.now();
  const promise = fetch('/stt', { method: 'POST', signal: ctl.signal,
                                  body: new Blob([toWav(earFlat, rate)], { type: 'audio/wav' }),
                                  headers })
    .then(r => r.json())
    .then(d => ({ d, earWaited: Math.round(performance.now() - earT0) }));
  return { promise, ctl };
}

function dropSpeculation(){
  if (!specPromise) return;
  try { specAbort.abort(); } catch(e){}
  specPromise.catch(() => {});          // its rejection is expected and has no reader
  specPromise = null; specAbort = null; specSamples = 0;
}

// The native capture comes back as one WAV, pre-roll already inside it, and goes up the same road as a
// webview capture: the same endpoint, the same headers, the same transcription handler.
// The native window arrives with its own header; this keeps the tail and rewrites the header, so the
// transcriber gets the utterance and nothing else. Depends on nothing in the shell, so it works on an
// old APK too.
function wavTail(u8, seconds){
  const R = 16000, CH = 1, BITS = 16, HDR = 44;
  const BPS = R * CH * (BITS / 8);
  const body = u8.length > HDR ? u8.subarray(HDR) : new Uint8Array(0);
  const want = Math.min(body.length, Math.max(BPS, Math.floor(seconds * BPS)));
  const keep = body.subarray(body.length - want);
  const out = new Uint8Array(HDR + keep.length);
  const dv = new DataView(out.buffer);
  const ascii = (off, str) => { for (let i = 0; i < str.length; i++) out[off + i] = str.charCodeAt(i); };
  ascii(0, 'RIFF'); dv.setUint32(4, 36 + keep.length, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, CH, true); dv.setUint32(24, R, true);
  dv.setUint32(28, BPS, true); dv.setUint16(32, CH * (BITS / 8), true); dv.setUint16(34, BITS, true);
  ascii(36, 'data'); dv.setUint32(40, keep.length, true);
  out.set(keep, HDR);
  return out;
}

function nativeEnd(){
  const ear = nativeEar;
  nativeEar = null;
  setState('transcribing');
  tl('native capture stopped');
  ear.stop().then(function(res){
    const secs = (res && res.seconds) || 0;
    if (!res || !res.wav || secs < 0.25){
      setState(earArmed ? 'listening' : 'idle');
      return;
    }
    const bin = atob(res.wav);
    let u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    // spoken time plus the pre-roll, with a small margin; anything longer is silence or an old turn
    const keepS = Math.min(14, Math.max(1.5, (Date.now() - recordStart) / 1000 + 1.5));
    u8 = wavTail(u8, keepS);
    tl('native window trimmed to ' + keepS.toFixed(1) + 's');
    const ctl = new AbortController();
    const got = performance.now();
    const promise = fetch('/stt', { method: 'POST', signal: ctl.signal,
                                    body: new Blob([u8], { type: 'audio/wav' }),
                                    headers: { 'Content-Type': 'audio/wav',
                                               'X-Jarvis-Page': BUILD + '+native' } })
      .then(r => r.json())
      .then(d => ({ d, earWaited: Math.round(performance.now() - got) }));
    tl('/stt sent (native)');
    handleTranscription(promise, secs, false);
  }).catch(function(e){
    console.log('native capture failed', e);
    nativeFailures++;
    setState(earArmed ? 'listening' : 'idle');
  });
}

function submit(earFlat){
  const earSeconds = earFlat.length / rate;
  tl('/stt sent');
  setState('transcribing');
  const up = uploadAudio(earFlat, false);
  handleTranscription(up.promise, earSeconds, false);
}

function handleTranscription(promise, earSeconds, reused){
  promise
    .then(({ d, earWaited }) => {
      earLastText = (d.text || '').trim();
      tl(reused ? '/stt returned (was already in flight)' : '/stt returned');
      lastMeta = 'clip ' + earSeconds.toFixed(1) + 's | heard in ' + earWaited + 'ms' +
                 (reused ? ' | speculative' : '') + ' | ' +
                 (d.transcribe_s !== undefined ? d.transcribe_s + 's of it transcribing' : (d.reason || ''));
      console.log('you said:', earLastText, '|', lastMeta);
      if (!earLastText){
        // He spoke and nothing came back. Going quiet here is indistinguishable from being
        // ignored, which is exactly how it read from his side.
        const why = d.reason || '';
        if (!why || (why.indexOf('no speech') !== 0 && why.indexOf('clip too short') !== 0
                     && why !== 'transcriber busy')){
          say('Did not catch that');
          cue('notcaught');
        } else if (why === 'transcriber busy'){
          say('One moment, say it again');
        }
        setState(earArmed ? 'listening' : 'idle');
        return;
      }
      say(earLastText);
      barged = false;
      ask(earLastText);
    })
    .catch(e => {
      if (e && e.name === 'AbortError') return;      // dropped on purpose: he was only pausing
      fail('Could not reach the transcriber.'); cue('lost');
      console.log(e); setState(earArmed ? 'listening' : 'idle');
    });
}

mic.addEventListener('click', () => {
  if (VOICE_PARKED){ voiceParkedNotice(); return; }
  audio();
  modeArm('voice');                       // the live button is what arms the voice
  if (earArmed && (playing || turnActive || Date.now() < EarAudioUntil)){
    ignoreUntil = Date.now() + 300;
    interrupt();
    if (earRecording){ endCapture(); return; }
    earRing = [];                   // drop the pre-roll: it holds his voice, not yours
    barged = true;               // this capture is deliberate, so the gate lets it through
    console.log('tapped to interrupt - listening now');
    beginCapture();
    return;
  }
  earArmed = !earArmed;
  syncMic();
  if (earArmed){
    openMic().then(ok => { if (ok) beginCapture(); });   // tap to talk: earRecording starts at once
  } else {
    if (earRecording) endCapture();
    setState(playing ? 'speaking' : 'idle');
  }
  syncMic();
});

// a seam for testing without a real microphone: feed samples down the same path the
// microphone uses, so the earCapture, the cutting and the upload can be checked for real
setInterval(() => {
  // Nothing can leave the microphone shut forever: if no sound has come out of him for a
  // minute, the turn is over whatever the flags believe.
  if (earTurnOpen && !audioBusy() && Date.now() - EarAudioUntil > 60000){
    earTurnOpen = false;
    console.log('released the microphone gate: no audio for a minute');
  }
}, 5000);

window.__jarvisFeed = arr => pushSamples(Float32Array.from(arr));
window.__jarvisArm = () => { earArmed = true; return earArmed; };
window.__jarvisBusy = ms => { EarAudioUntil = Date.now() + (ms || 0); return EarAudioUntil; };
window.__jarvisPlaying = v => { playing = !!v; if (v) EarAudioUntil = Date.now() + 500; return playing; };
window.__jarvisVisual = s => { state = s; syncMic(); return state; };
window.__jarvisSync = syncMic;
// Feed a complete MP3 through the streaming player exactly as the server would, so the
// chunked path can be tested against real audio without a microphone.
let feedCounter = 0;
window.__jarvisFeedAudio = (b64, size) => {
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const n = ++feedCounter + 1000;
  const step = size || 8192;
  for (let o = 0; o < bytes.length; o += step) pushUnit(n, bytes.subarray(o, Math.min(o + step, bytes.length)));
  endUnit(n);
  return n;
};
window.__jarvisMp3PrefixLength = mp3PrefixLength;
window.__jarvisSched = () => schedLog.slice();
window.__jarvisAudioState = () => ({
  sources: sources.length, open: unitsOpen.size, playing,
  scheduled: +scheduled.toFixed(3), ctx: +audio().currentTime.toFixed(3),
  played: Object.keys(unitStreams).map(k => +unitStreams[k].played.toFixed(3))
});
window.__jarvisCue = cue;
window.__jarvisSpec = () => ({ inFlight: !!specPromise, samples: specSamples });
window.__jarvisState = () => ({ earRecording, earArmed, rate, floor, loudBlocks,
                                ringSamples: earRing.reduce((n, a) => n + a.length, 0),
                                settling: Date.now() < EarAudioUntil, quietBlocks: EarQuietBlocks, turnOpen: earTurnOpen,
                                earLastText, lastMeta, clientTurn, stateLog: stateLog.slice(-14) });

resetBtn.addEventListener('click', () => {
  say('New conversation');
  // The page owns the conversation, so the page starts the new one: it writes the thread to its own store,
  // blanks the canvas, clears the dock and mints the machine's next window. Doing it here instead is how
  // the dock kept the previous chat's running state and the next question was refused as the last one's.
  if (window.__jarvisNewChat) {
    try { window.__jarvisNewChat(); return; } catch (e) { console.log(e); }
  }
  // No page-level new chat: the old way, minus the interrupt. A turn still being written belongs to the
  // conversation being left and keeps going in it; cancelling it here ended his work just because he
  // moved to another chat.
  try { if (typeof detachTurn === 'function') detachTurn(); } catch (e) {}
  try { window.__jarvisFlushSession && window.__jarvisFlushSession(); } catch (e) {}
  try { window.__jarvisResetSurface && window.__jarvisResetSurface(); } catch (e) {}
  try { window.__jarvisUnlockDock && window.__jarvisUnlockDock(); } catch (e) {}
  fetch('/reset', { method: 'POST' })
    .then(r => { if (!r.ok) throw new Error('reset failed: ' + r.status); })
    .then(() => console.log('conversation reset'))
    .catch(e => { fail('Could not start a new conversation.'); console.log(e); });
});

sendBtn.addEventListener('click', () => {
  const v = input.value.trim();
  if (!v) return;
  // One turn at a time in a conversation. A second send while the first is still being answered would
  // either cut the answer he is reading short or open a second stream onto the same conversation, and
  // both look like the page losing his question. His words stay in the box, where he can send them the
  // moment the answer lands — and the live button is there for the turn he wants to stop now.
  if (liveTurn && liveTurn.running !== false && !liveTurn.closed && !liveTurn.detached
      && String(liveTurn.conv) === String(convId())){
    tl('send refused: this conversation is still being answered');
    say('Still answering the last one');
    return;
  }
  modeArm('text');                   // typing arms the text mode, always
  input.value = '';                  // the box empties as he sends, not when the answer lands
  tl('endpoint decided'); tlEndpoint = Math.round(performance.now() - TL0);
  ask(v);
});
input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); sendBtn.click(); } });
document.addEventListener('click', () => audio(), {once:true});
window.__jarvisRegenerateAsk = function(q){ ask(q, 'text'); };

// The armed mode, shown and switchable. The inputs set it (the live button arms voice, the typing
// box arms text); this is the one place he can also set it by hand, because a mode he cannot see is
// a mode he cannot trust.
const modeBtn = document.getElementById('modeBtn');
if (modeBtn) modeBtn.addEventListener('click', () => modeArm(mode === 'voice' ? 'text' : 'voice'));
modeArm(mode);
// What the collision tests read: which mode is armed for the next turn, whether the microphone is
// actually open, and whether any sound is scheduled.
window.__jarvisModes = () => ({ mode: mode, turnMode: turnMode, earArmed: earArmed,
                                micOpen: !!earMicStream, audioBusy: audioBusy(),
                                typing: fallback.classList.contains('show') });
setState('idle');

/* A deploy must reach the phone. An installed app keeps its document, so the worker tells an open
   page to reload once it has taken over. Never mid-turn: a turn in flight is someone waiting. */
if (window.navigator && navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || d.type !== 'jarvis-reload') return;
    var busy = false;
    try { busy = !!(window.__jarvisModes && window.__jarvisModes().audioBusy); } catch (err) {}
    var working = document.body && document.body.getAttribute('data-phase') === 'working';
    if (busy || working) { setTimeout(function () { location.reload(); }, 20000); }
    else { location.reload(); }
  });
}

</script>
