<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job pricer</title>
<style>
  :root{--ground:#111316;--ink:#EDEAE6;--muted:#8A8681;--copper:#BD765C;--line:#26292D;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;padding:24px 18px 40px;}
  h1{font-size:19px;font-weight:600;letter-spacing:.01em;margin:0 0 22px;}
  label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--muted);margin:0 0 6px;}
  .row{margin:0 0 18px;}
  input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
        color:var(--ink);font-size:24px;font-variant-numeric:tabular-nums;
        padding:6px 0 8px;outline:none;}
  input:focus{border-color:var(--copper);}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--line);
        padding:0;margin:14px 0 0;border:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
        border-radius:50%;background:var(--copper);border:0;}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--copper);}
  .pct{font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink);}
  hr{border:0;border-top:1px solid var(--line);margin:26px 0 20px;}
  .line{display:flex;justify-content:space-between;align-items:baseline;
        font-size:15px;color:var(--muted);margin:0 0 12px;font-variant-numeric:tabular-nums;}
  .line span:last-child{color:var(--ink);}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;}
  .total span:first-child{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .total span:last-child{font-size:34px;font-weight:600;color:var(--copper);
        font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .note{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.5;}
</style>
</head>
<body>
<h1>Job pricer</h1>

<div class="row">
  <label for="qty">Units</label>
  <input id="qty" type="number" inputmode="numeric" min="0" step="1" value="12">
</div>

<div class="row">
  <label for="price">Unit price (UGX)</label>
  <input id="price" type="number" inputmode="numeric" min="0" step="500" value="45000">
</div>

<div class="row">
  <label for="disc">Discount</label>
  <div class="pct"><span id="discOut">10</span>%</div>
  <input id="disc" type="range" min="0" max="50" step="0.5" value="10">
</div>

<hr>

<div class="line"><span>Subtotal</span><span id="sub">—</span></div>
<div class="line"><span>Discount</span><span id="save">—</span></div>

<div class="total"><span>Total</span><span id="total">—</span></div>

<p class="note">Figures recompute as you type. Nothing leaves this page.</p>

<script>
(function(){
  var qty = document.getElementById('qty');
  var price = document.getElementById('price');
  var disc = document.getElementById('disc');
  var discOut = document.getElementById('discOut');
  var subEl = document.getElementById('sub');
  var saveEl = document.getElementById('save');
  var totalEl = document.getElementById('total');

  function fmt(n){
    return Math.round(n).toLocaleString('en-UG');
  }
  function calc(){
    var q = Math.max(0, parseFloat(qty.value) || 0);
    var p = Math.max(0, parseFloat(price.value) || 0);
    var d = Math.max(0, Math.min(100, parseFloat(disc.value) || 0));
    var sub = q * p;
    var save = sub * d / 100;
    discOut.textContent = (Math.round(d * 10) / 10).toString();
    subEl.textContent = fmt(sub) + ' UGX';
    saveEl.textContent = fmt(save) + ' UGX';
    totalEl.textContent = fmt(sub - save) + ' UGX';
  }
  [qty, price].forEach(function(el){ el.addEventListener('input', calc); });
  disc.addEventListener('input', calc);
  calc();
})();
</script>
</body>
</html>
