# A stop waits for a turn in flight before it lands.
#
# This is the drop-in that produces the behaviour, kept here so the deployment is reproducible:
# install it at ~/.config/systemd/user/jarvis-live.service.d/drain.conf and `systemctl --user
# daemon-reload`.
#
# server.py runs uvicorn with a 3-second graceful window (an open SSE stream would otherwise hold
# the process open until systemd lost patience). The cost of that cap is that a plain restart cuts
# the turn being watched mid-answer. ExecStop runs BEFORE systemd sends the kill signal, so the
# drain finishes the turn and the page never reports a failure at all.
#
# There is no ExecStopPre in systemd: it is rejected as "Unknown key name" and ignored, so a drain
# can look installed and never run. ExecStop is the directive that exists.
#
# Measured, 2026-10-08: stop requested 04:51:03, drain reported 1 turn in flight, turn completed
# 04:51:04 (end=completed, 42 chars, client saw `done` and no error), stopped and restarted
# 04:51:08. Before this, the same restart cut the turn and the page showed a failure.
[Service]
ExecStop=/data/apps/jarvis-live/tools/drain.sh
TimeoutStopSec=360
